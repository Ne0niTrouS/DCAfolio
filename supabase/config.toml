# DCAfolio — Supabase local development configuration.
# Applied by `supabase start`. Requires Docker Desktop.

project_id = "dcafolio"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/stocks.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
# Local mail catcher — password-reset emails land here during development.
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

# V1 uses email + password only. No OAuth providers, no magic links, no phone.

[edge_runtime]
enabled = true
policy = "oneshot"
